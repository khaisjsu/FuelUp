# Render Blueprint: Postgres + the FastAPI backend.
# Render dashboard > New > Blueprint > pick this repo. Render reads this file,
# creates both resources and wires DATABASE_URL for you.
databases:
  - name: fuelcast-db
    plan: free            # free Postgres expires after a trial period; pick a paid plan to keep the data
    databaseName: fuelcast
    user: fuelcast

services:
  - type: web
    name: fuelcast-api
    runtime: python
    plan: free            # free services sleep when idle; the first request then takes ~1 minute
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fuelcast-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: "*"        # after deploying the web app, set this to its URL, e.g. https://fuelcast.vercel.app
      - key: AUTO_SEED
        value: "1"
      - key: ALLOW_RESET
        value: "1"

  # Optional: host the website on Render instead of Vercel. Uncomment, then set
  # NEXT_PUBLIC_API_URL to the API's URL (shown on the fuelcast-api page).
